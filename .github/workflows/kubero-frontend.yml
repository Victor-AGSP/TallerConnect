name: Publicar TallerConnect Frontend

on:
  push:
    branches:
      - deploy/kubero-frontend
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Obtener codigo
        uses: actions/checkout@v4

      - name: Autenticacion GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Construir y publicar imagen
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/victor-agsp/tallerconnect-frontend:latest
            ghcr.io/victor-agsp/tallerconnect-frontend:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/Victor-AGSP/TallerConnect
          build-args: |
            EXPO_PUBLIC_APP_ENV=integration
            EXPO_PUBLIC_API_URL=https://api-tallerconnect.inf.uct.cl/api
            EXPO_PUBLIC_USE_MOCK_AUTH=false
            EXPO_PUBLIC_USE_MOCK_SERVICES=false
